p class="small mt16">Тренажер автоматты түрде ми жұмысын өлшемейді; ол тапсырмаларға берген жауаптарыңды тіркейді.</p></div></div>`}

function uniqueOpts(right,extras,size=4){const all=[String(right),...extras.map(String).filter(x=>String(x)!==String(right))];return shuffle([...new Set(all)].slice(0,size))}
function generateGame(id){if(id==='recognize'){let v=rnd(100,99999);let options=uniqueOpts(v,[v+1,v-1,v+10,v-10,v+100,v-100].filter(x=>x>=0));while(options.length<4)options.push(String(rnd(100,99999)));return{type:'choice',display:nfmt(v),prompt:'Қай санды көрдің?',options,answer:String(v),explanation:`Көрсетілген сан — ${nfmt(v)}.`,visual:null}}
 if(id==='compare'){let a=rnd(101,89999),b=a+rnd(1,1400)*(Math.random()<.5?-1:1);b=Math.max(0,b);return{type:'choice',prompt:'Қай сан үлкен?',visual:`${nfmt(a)}      ≷      ${nfmt(b)}`,options:[nfmt(a),nfmt(b)],answer:nfmt(Math.max(a,b)),explanation:`${nfmt(Math.max(a,b))} саны ${nfmt(Math.min(a,b))} санынан үлкен.`}}
 if(id==='memory'){let code=Array.from({length:rnd(8,10)},()=>rnd(0,9)).join('');let grouped=Math.random()<.5;let display=grouped?code.match(/.{1,3}/g).join(' '):code;return{type:'input',display,prompt:'Экранда көрсетілген кодты енгіз.',answer:code,condition:grouped?'Топтастырылған':'Тұтас',explanation:`Код: ${display}. ${grouped?'Цифрлар топтарға бөлініп көрсетілді.':'Цифрлар тұтас көрсетілді.'}`}}
 if(id==='format'){const pool=[{v:1250000,display:'бір миллион екі жүз елу мың'},{v:12548,display:'12 548'},{v:2500000,display:'2,5 млн'},{v:375,display:'үш жүз жетпіс бес'},{v:15000,display:'он бес мың'},{v:9999,display:'9 999'},{v:2000000,display:'2 миллион'},{v:300500,display:'300 500'}];let x=pick(pool);let others=shuffle(pool.filter(y=>y.v!==x.v)).slice(0,3);return{type:'choice',prompt:'Бұл жазылым қандай санды білдіреді?',visual:x.display,options:shuffle([x,...others].map(t=>nfmt(t.v))),answer:nfmt(x.v),explanation:`${x.display} = ${nfmt(x.v)}.`}}
 if(id==='price'){let pool=[{prompt:'9 999 тг және 10 000 тг айырмасы неше теңге?',options:['1 тг','10 тг','100 тг','1 000 тг'],answer:'1 тг',explanation:'10 000 − 9 999 = 1 теңге.'},{prompt:'14 990 тг және 15 000 тг айырмасы қанша?',options:['10 тг','100 тг','1 тг','1 000 тг'],answer:'10 тг',explanation:'15 000 − 14 990 = 10 теңге.'},{prompt:'Қай тауар арзан: А — 12 500 тг, әлде Ә — 12 050 тг?',options:['А тауар','Ә тауар','Екеуі тең','Айыру мүмкін емес'],answer:'Ә тауар',explanation:'12 050 теңге 12 500 теңгеден 450 теңгеге арзан.'},{prompt:'8 999 тг бағасы 9 000 тг-ден қаншаға арзан?',options:['1 тг','9 тг','100 тг','1 001 тг'],answer:'1 тг',explanation:'9 000 − 8 999 = 1 теңге.'},{prompt:'Бастапқы баға 5 000 тг, жаңа баға 4 000 тг. Нақты үнем?',options:['500 тг','1 000 тг','4 000 тг','20 тг'],answer:'1 000 тг',explanation:'5 000 − 4 000 = 1 000 теңге.'}];return{type:'choice',...pick(pool)}}
 if(id==='percent'){let price=pick([1000,1200,2000,2500,3000,4000,5000]),p=pick([10,20,25,30,50]),saving=price*p/100,after=price-saving,askSaving=Math.random()<.5,answer=askSaving?saving:after,opts=uniqueOpts(nfmt(answer)+' тг',[nfmt(askSaving?after:saving)+' тг',nfmt(answer+100)+' тг',nfmt(Math.max(0,answer-100))+' тг',nfmt(price)+' тг']);return{type:'choice',prompt:`${nfmt(price)} тг тауарға ${p}% жеңілдік берілді. ${askSaving?'Қанша теңге үнемделеді?':'Жеңілдіктен кейінгі баға қанша?'}`,options:opts,answer:nfmt(answer)+' тг',explanation:`${nfmt(price)} × ${p}% = ${nfmt(saving)} тг. Соңғы баға: ${nfmt(after)} тг.`}}
 if(id==='speed'){const kind=pick(['add','sub','compare']);if(kind==='compare'){let a=rnd(50,600),b=a+rnd(1,120);return{type:'choice',prompt:'Қай сан үлкен?',visual:`${a}   немесе   ${b}`,options:shuffle([String(a),String(b)]),answer:String(b),explanation:`${b} > ${a}.`}}const a=rnd(15,90),b=rnd(4,35),answer=kind==='add'?a+b:a-b;return{type:'choice',prompt:`${a} ${kind==='add'?'+':'−'} ${b} = ?`,options:uniqueOpts(answer,[answer+1,answer-1,answer+10,answer-10,answer+2]),answer:String(answer),explanation:`${a} ${kind==='add'?'+':'−'} ${b} = ${answer}.`}}
}
function startGame(){clearTimers();const count=selectedModule==='speed'?8:5;session={module:selectedModule,index:0,questions:Array.from({length:count},()=>generateGame(selectedModule)),records:[],phase:'ready'};prepareGame()}
function prepareGame(){clearTimers();const id=session.module;session.phase=(id==='recognize'||id==='memory')?'ready':'answer';session.startedAt=performance.now();render();if(id==='speed'&&session.phase==='answer')startRapidTimer()}
function revealGame(){if(!session||session.phase!=='ready')return;session.phase='flash';render();timeoutId=setTimeout(()=>{if(!session||session.phase!=='flash'||view!=='games')return;session.phase='answer';session.startedAt=performance.now();render()},session.module==='recognize'?1800:4000)}
function startRapidTimer(){const limit=8000,start=performance.now();clearInterval(intervalId);intervalId=setInterval(()=>{if(!session||session.phase!=='answer')return;const left=Math.max(0,limit-(performance.now()-start));const t=$('#timeLeft'),bar=$('#countBar');if(t)t.textContent=(left/1000).toFixed(1)+' с';if(bar)bar.style.width=100*left/limit+'%';if(left<=0){clearInterval(intervalId);submitGameAnswer(null,true)}},70)}
function submitGameAnswer(value,timedOut=false){if(!session||session.phase!=='answer')return;clearTimers();const task=session.questions[session.index];if(task.type==='input')value=validNum(value);let ok=!timedOut&&String(value)===String(task.answer);let time=timedOut?8:Math.max(.01,(performance.now()-session.startedAt)/1000);let explain=timedOut?`Уақыт аяқталды. ${task.explanation}`:ok?task.explanation:`Дұрыс жауап: ${task.answer}. ${task.explanation}`;session.records.push({question:task.prompt,condition:task.condition||'',answer:value??'Уақыт бітті',expected:task.answer,correct:ok,time:Number(time.toFixed(2)),explanation:explain});session.phase='feedback';render()}
function nextGame(){if(!session||session.phase!=='feedback')return;if(session.index===session.questions.length-1){endGame();return}session.index++;prepareGame()}
function endGame(){const m=MODULES.find(x=>x.id===session.module);let records=session.records,correct=records.filter(r=>r.correct).length;data.games.unshift({id:m.id,name:m.name,date:new Date().toISOString(),records:records.map(r=>({...r})),correct,total:records.length,avg:mean(records.map(r=>r.time))});data.games=data.games.slice(0,120);persist();session.phase='complete';render()}
function gameComplete(m,s){const right=s.records.filter(r=>r.correct).length,rate=Math.round(100*right/s.records.length);return `<div class="pagehead"><div><div class="breadcrumbs">${esc(m.name)} / ҚОРЫТЫНДЫ</div><h1>Жеке нәтижең дайын</h1><p>Бұл сессияның өлшемдері браузерде сақталды.</p></div></div><div class="trainer-layout"><div class="play-area"><div class="play-inner center"><div class="eyebox">ТАПСЫРМАЛАР АЯҚТАЛДЫ</div><div class="complete-score">${rate}<span>%</span></div><h2>${right} / ${s.records.length} дұрыс жауап</h2><p class="muted">Орташа жауап уақыты: <strong style="color:var(--text)">${sec(mean(s.records.map(r=>r.time)))}</strong></p><div class="action-row" style="justify-content:center"><button class="btn primary" data-action="start-game">↻ Қайта ойнау</button><button class="btn secondary" data-go="results">▥ Нәтижелер</button><button class="btn ghost" data-action="back-games">7 ойынға қайту</button></div></div></div><aside class="play-side"><div class="panel"><h3>Тапсырмалар талдауы</h3><div class="details-list">${s.records.map((r,i)=>`<div class="details-row"><span>${i+1}-тапсырма</span><strong class="${r.correct?'good-text':'bad-text'}">${r.correct?'✓ Дұрыс':'✕ Қате'} · ${sec(r.time)}</strong></div>`).join('')}</div></div></aside></div>`}

function prepareLab(){clearTimers();const t=labSession.trials[labSession.index];labSession.phase=t.type==='input'?'ready':'answer';labSession.startedAt=performance.now();render()}
function revealLab(){if(!labSession||labSession.phase!=='ready')return;labSession.phase='flash';render();timeoutId=setTimeout(()=>{if(!labSession||labSession.phase!=='flash'||view!=='labs')return;labSession.phase='answer';labSession.startedAt=performance.now();render()},4000)}
function answerLab(answer){if(!labSession||labSession.phase!=='answer')return;const t=labSession.trials[labSession.index];if(t.type==='input')answer=validNum(answer);let correct=t.answer===null||t.answer===undefined?null:String(answer)===String(t.answer);let time=Math.max(.01,(performance.now()-labSession.startedAt)/1000);let note=t.note;if(correct===false)note=`Дұрыс жауап: ${t.answer}. ${t.note}`;labSession.records.push({condition:t.condition,question:t.prompt,answer:answer===null?'Оқып бітірдім':String(answer),expected:t.answer,correct,time:Number(time.toFixed(2)),note,format:t.display||t.visual||''});labSession.phase='feedback';render()}
function nextLab(){if(!labSession||labSession.phase!=='feedback')return;if(labSession.index>=labSession.trials.length-1){endLab();return}labSession.index++;prepareLab()}
function endLab(){let m=LABS.find(x=>x.id===labSession.lab);data.labs.unshift({id:m.id,name:m.name,date:new Date().toISOString(),records:labSession.records.map(r=>({...r}))});data.labs=data.labs.slice(0,120);persist();labSession.phase='complete';render()}
function getGroups(records){const groups={};for(let r of records){if(!groups[r.condition])groups[r.condition]=[];groups[r.condition].push(r)}return Object.entries(groups).map(([name,rs])=>({name,n:rs.length,time:mean(rs.map(r=>r.time)),accuracy:rs.filter(r=>r.correct!==null).length?Math.round(100*rs.filter(r=>r.correct).length/rs.filter(r=>r.correct!==null).length):null}))}
function groupBars(groups){const max=Math.max(...groups.map(g=>g.time),.01);return `<div class="bars">${groups.map(g=>`<div class="barrow"><span class="barlabel">${esc(g.name)} <small>(n=${g.n})</small></span><div class="mini-bar"><span style="width:${Math.max(1,100*g.time/max)}%"></span></div><strong>${sec(g.time)}</strong></div>`).join('')}</div>`}
function labComplete(m,s){let groups=getGroups(s.records);const valid=s.records.filter(r=>r.correct!==null);let ratio=valid.length?Math.round(100*valid.filter(r=>r.correct).length/valid.length):null;return `<div class="pagehead"><div><div class="breadcrumbs">ТӘЖІРИБЕ АЯҚТАЛДЫ / ${m.n}</div><h1>Зерттеу деректері</h1><p>Бұл — жаңа орындалған сынақтар нәтижесі. Басқа қатысушылар туралы қорытынды жасалмайды.</p></div></div><div class="two-col"><div class="panel"><h3>Шарттар бойынша орташа уақыт</h3>${groupBars(groups)}<p class="small mt24">Шағын сынақта айырмашылыққа жаттығу, тапсырма реті және басқа жағдайлар әсер етуі мүмкін.</p></div><div class="panel"><h3>Жалпы көрсеткіштер</h3><div class="details-list"><div class="details-row"><span>Сынақ саны</span><strong>${s.records.length}</strong></div><div class="details-row"><span>Орташа уақыт</span><strong>${sec(mean(s.records.map(r=>r.time)))}</strong></div><div class="details-row"><span>${ratio===null?'Жауап сипаты':'Дұрыс жауап үлесі'}</span><strong>${ratio===null?'Субъективті / оқу':ratio+'%'}</strong></div></div><div class="action-row"><button class="btn primary" data-action="start-lab">↻ Қайталау</button><button class="btn secondary" data-go="results">Барлық нәтижелер</button><button class="btn ghost" data-action="back-labs">Тәжірибелерге</button></div></div></div><div class="panel mt16"><h3>Жеке сынақ журналы</h3><div class="table-wrap"><table class="data-table"><thead><tr><th>№</th><th>Шарт / формат</th><th>Жауап</th><th>Уақыт</th><th>Баға</th></tr></thead><tbody>${s.records.map((r,i)=>`<tr><td>${i+1}</td><td>${esc(r.condition)}</td><td>${esc(r.answer)}</td><td>${sec(r.time)}</td><td>${r.correct===null?'—':r.correct?'Дұрыс':'Қате'}</td></tr>`).join('')}</tbody></table></div></div>`}
function resultsPage(){const gr=data.games,lr=data.labs,allGame=gr.flatMap(r=>r.records||[]),rate=accuracy(gr),avg=allGame.length?mean(allGame.map(r=>r.time)):null;let map=MODULES.map(m=>{let all=gr.filter(r=>r.id===m.id).flatMap(r=>r.records||[]);return{m,count:all.length,acc:all.length?Math.round(100*all.filter(r=>r.correct).length/all.length):null,time:all.length?mean(all.map(r=>r.time)):null}});return `<div class="pagehead"><div><div class="breadcrumbs">ЖЕКЕ НӘТИЖЕЛЕР / ТАЛДАУ</div><h1>Менің сандық профилім</h1><p>Тек осы құрылғыдағы орындалған тапсырмалар негізінде құрылған статистика. Нәтижелер автоматты сақталады.</p></div></div><div class="stat-grid"><div class="stat"><div class="stat-top">ОЙЫН СЕССИЯЛАРЫ <span>▦</span></div><strong>${gr.length}</strong><div class="unit">аяқталған ойын</div></div><div class="stat"><div class="stat-top">ТӘЖІРИБЕЛЕР <span>⚗</span></div><strong>${lr.length}</strong><div class="unit">аяқталған зерттеу</div></div><div class="stat"><div class="stat-top">ЖАЛПЫ ДӘЛДІК <span>◎</span></div><strong>${rate===null?'—':rate+'%'}</strong><div class="unit">ойын тапсырмалары</div></div><div class="stat"><div class="stat-top">ОРТАША УАҚЫТ <span>◷</span></div><strong>${avg===null?'—':avg.toFixed(2)}</strong><div class="unit">секунд / жауап</div></div></div><div class="two-col mt24"><section class="panel"><h3>Ойындар бойынша дәлдік</h3>${map.some(x=>x.count)?`<div class="bars">${map.map(x=>`<div class="barrow"><span class="barlabel">${esc(x.m.name)}</span><div class="mini-bar"><span style="width:${x.acc??0}%"></span></div><strong>${x.acc===null?'—':x.acc+'%'}</strong></div>`).join('')}</div>`:`<div class="empty-box"><span>▦</span>Әзірге ойын нәтижесі жоқ.<br>Ойынды орындағанда осы жерде диаграмма пайда болады.</div>`}</section><section class="panel"><h3>Ойындар бойынша орташа уақыт</h3>${map.some(x=>x.count)?groupBars(map.filter(x=>x.count).map(x=>({name:x.m.name,n:x.count,time:x.time}))):`<div class="empty-box"><span>◷</span>Уақыт өлшемдері әлі жиналған жоқ.</div>`}<p class="small mt16">Жауап уақыты тапсырмалардың күрделілігіне байланысты. Ойындар арасындағы уақытты тікелей салыстыру шектеулі.</p></section></div>${section('Зертханалық тәжірибелер','Әр эксперименттегі шарттар салыстыруы')}${lr.length?`<div class="tile-grid">${lr.slice(0,6).map(l=>`<div class="panel"><h3>${esc(l.name)}</h3><p>${new Date(l.date).toLocaleString('kk-KZ')} • ${l.records.length} сынақ</p>${groupBars(getGroups(l.records))}</div>`).join('')}</div>`:`<div class="empty-box"><span>⚗</span>Тәжірибелер әлі орындалмаған.<br>«6 тәжірибе» бөлімінен зерттеуді баста.</div>`}${section('Сессиялар тарихы','Ойындар мен зерттеулердің соңғы аяқталған нәтижелері')}<div class="panel"><div class="table-wrap"><table class="data-table"><thead><tr><th>Уақыты</th><th>Бөлім</th><th>Түрі</th><th>Сынақ</th><th>Дәлдік</th><th>Орташа уақыт</th></tr></thead><tbody>${[...gr.map(x=>({...x,type:'Ойын'})),...lr.map(x=>({...x,type:'Тәжірибе'}))].sort((a,b)=>new Date(b.date)-new Date(a.date)).slice(0,20).map(r=>{let rr=r.records||[],valid=rr.filter(x=>x.correct!==null),rate=valid.length?Math.round(100*valid.filter(x=>x.correct).length/valid.length)+'%':'—';return `<tr><td>${new Date(r.date).toLocaleString('kk-KZ')}</td><td>${esc(r.name)}</td><td>${r.type}</td><td>${rr.length}</td><td>${rate}</td><td>${sec(mean(rr.map(x=>x.time)))}</td></tr>`}).join('')||'<tr><td colspan="6" class="center">Тарих бос. Әуелі бір ойынды немесе тәжірибені аяқта.</td></tr>'}</tbody></table></div><div class="action-row"><button class="btn secondary" data-action="export-csv" ${!gr.length&&!lr.length?'disabled':''}>↓ CSV кестесі</button><button class="btn secondary" data-action="export-json" ${!gr.length&&!lr.length?'disabled':''}>↓ JSON деректері</button><button class="btn ghost" data-action="print">⎙ Басып шығару</button><button class="btn danger" data-action="reset" ${!gr.length&&!lr.length?'disabled':''}>⌫ Тарихты тазалау</button></div><p class="small mt16">CSV — Excel-де ашылатын кесте; JSON — толық құрылымды деректер. Деректер серверге жіберілмейді.</p></div>`}
function rulesPage(){return `<div class="pagehead"><div><div class="breadcrumbs">ҒЫЛЫМИ ЖОБА / ҰСЫНЫСТАР</div><h1>Санды түсінікті көрсетудің 7 ережесі</h1><p>Жобадағы практикалық тұжырымдарды күнделікті өмірде, сабақта, бағаларды оқуда және ақпаратты жобалауда қолдануға болады.</p></div></div><div class="rule-grid">${RULES.map((r,i)=>`<article class="rule-card"><div class="rule-num">${String(i+1).padStart(2,'0')} / ЕРЕЖЕ</div><h3>${r[0]}</h3><p>${r[1]}</p><div class="rule-example">${r[2]}</div></article>`).join('')}</div><div class="banner-small mt24"><h3>Қорытынды ой</h3><p>Мақсат — санды әдемі көрсету ғана емес, оны тезірек әрі дұрыс түсінуге көмектесетін ұсыну тәсілін табу.</p></div>`}
function aboutPage(){return `<div class="pagehead"><div><div class="breadcrumbs">ЗЕРДЕ / ҒЫЛЫМИ ЖОБА</div><h1>Адам миы санды қалай қабылдайды?</h1><p>Ғылыми жоба материалдарына сүйеніп әзірленген SMART NUMBER интерактивті прототипі.</p></div></div><div class="two-col"><section class="panel"><div class="eyebox">ЖОБА ПАСПОРТЫ</div><h3>Зерттеудің негізгі деректері</h3><div class="details-list"><div class="details-row"><span>Жоба атауы</span><strong>Адам миы санды қалай қабылдайды?</strong></div><div class="details-row"><span>Бағыт</span><strong>Жаратылыстану-математикалық</strong></div><div class="details-row"><span>Секция</span><strong>Математика және қолданбалы математика</strong></div><div class="details-row"><span>Оқушы</span><strong>Садыков Асыл Арупжанович</strong></div><div class="details-row"><span>Сыныбы / мектебі</span><strong>7 «Б», №180 мектеп-гимназиясы, Алматы</strong></div><div class="details-row"><span>Ғылыми жетекші</span><strong>Қайлыбек Жаңылнұр</strong></div><div class="details-row"><span>Оқу жылы</span><strong>2026–2027</strong></div></div></section><section class="panel"><h3>Зерттеу сұрағы</h3><div class="note">Адам миы сандарды қалай қабылдайды және сандық ақпаратты әртүрлі форматта ұсыну оны түсіну мен есте сақтауға қалай әсер етуі мүмкін?</div><h3 class="mt24">Болжам</h3><p>Санды мағыналық бөліктерге бөлу, түсінікті форматта беру және нақты өмірлік жағдаймен байланыстыру сандық ақпаратты қабылдауға көмектесуі мүмкін.</p><h3 class="mt24">Өнімнің мақсаты</h3><p>Санды тану, салыстыру, есте сақтау, бағаны бағалау және пайызды есептеу дағдыларына арналған жаттығулар арқылы жеке деректер жинау.</p></section></div>${section('Бұл цифрлық өнімде не бар?','Тренажердің мүмкіндіктері')}<div class="tile-grid"><div class="tile"><div class="tile-icon">▦</div><h3>7 ойын</h3><p>Санды тану, салыстыру, есте сақтау, формат, баға, пайыз және жылдам жауап.</p></div><div class="tile"><div class="tile-icon">⚗</div><h3>6 тәжірибе</h3><p>Жоба мәтініндегі алты зерттеу бағытын интерактивті түрде қайта орындау.</p></div><div class="tile"><div class="tile-icon">▥</div><h3>Нақты нәтиже</h3><p>Жауап беру уақыты, дұрыс жауап, орташа мән, диаграмма және деректер экспорты.</p></div></div><div class="panel mt24"><h3>Ғылыми және техникалық ескерту</h3><p>«SMART NUMBER» медициналық немесе нейропсихологиялық диагностикалық құрал емес. Ол экранға берілген жауаптарды және жауап беру уақытын өлшейді. Қысқа тәжірибелердің нәтижелері барлық адамға ортақ заңдылықты дәлелдемейді.</p><p>Бастапқы ғылыми жоба материалында эксперименттердің тақырыптары мен өлшенетін көрсеткіштері көрсетілген, бірақ қатысушылардың толық сандық деректер кестесі жоқ. Сол себепті сайтта ойдан шығарылған «зерттеу қорытындысы» берілмейді. Әр жаңа пайдаланушы өз нәтижелерін жинайды.</p><p>Қосымша кітапхана, интернет немесе тіркелу қажет емес. Барлық ойындар мен тәжірибелер бір HTML файлдың ішінде. Жиналған деректер тек қолданылып отырған браузердің жергілікті сақтау орнында болады.</p></div>`}
function exportData(type){if(!data.games.length&&!data.labs.length)return;let content,filename,mime;if(type==='json'){content=JSON.stringify({project:'SMART NUMBER',exported:new Date().toISOString(),games:data.games,labs:data.labs},null,2);filename='SMART_NUMBER_results.json';mime='application/json;charset=utf-8'}else{let rows=[['Бөлім түрі','Күні','Бөлім атауы','Сұрақ №','Шарт','Сұрақ','Жауап','Дұрыс жауап','Дәлдік','Уақыт (секунд)']];for(let [kind,items] of [['Ойын',data.games],['Тәжірибе',data.labs]])for(let s of items)for(let [i,r] of (s.records||[]).entries())rows.push([kind,s.date,s.name,i+1,r.condition||'',r.question||'',r.answer||'',r.expected??'',r.correct===null?'Субъективті/оқу':r.correct?'Дұрыс':'Қате',r.time]);content='\uFEFF'+rows.map(row=>row.map(x=>'"'+String(x??'').replace(/"/g,'""')+'"').join(';')).join('\r\n');filename='SMART_NUMBER_results.csv';mime='text/csv;charset=utf-8'}const url=URL.createObjectURL(new Blob([content],{type:mime}));const a=document.createElement('a');a.href=url;a.download=filename;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),3000)}
function handleAction(action,btn){if(action==='theme'){data.theme=data.theme==='light'?'dark':'light';persist();renderNav();return}if(action==='back-games'){clearTimers();session=null;selectedModule=null;render();return}if(action==='start-game'){startGame();return}if(action==='reveal-game'){revealGame();return}if(action==='game-answer'){submitGameAnswer(btn.dataset.answer);return}if(action==='submit-game-input'){const input=$('#answerInput');if(input&&!validNum(input.value)){input.focus();return}submitGameAnswer(input?.value||'');return}if(action==='next-game'){nextGame();return}if(action==='back-labs'){clearTimers();labSession=null;selectedLab=null;render();return}if(action==='start-lab'){startLab();return}if(action==='reveal-lab'){revealLab();return}if(action==='lab-answer'){answerLab(btn.dataset.answer);return}if(action==='lab-read-done'){answerLab(null);return}if(action==='submit-lab-input'){const input=$('#labInput');if(input&&!validNum(input.value)){input.focus();return}answerLab(input?.value||'');return}if(action==='next-lab'){nextLab();return}if(action==='export-csv'){exportData('csv');return}if(action==='export-json'){exportData('json');return}if(action==='print'){window.print();return}if(action==='reset'){if(window.confirm('Барлық ойын және тәжірибе нәтижелерін осы браузерден өшіру керек пе? Бұл әрекетті қайтару мүмкін емес.')){data.games=[];data.labs=[];persist();render()}return}}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.go){go(b.dataset.go);return}if(b.dataset.module){clearTimers();view='games';selectedModule=b.dataset.module;session=null;render();window.scrollTo({top:0,behavior:'smooth'});return}if(b.dataset.lab){clearTimers();view='labs';selectedLab=b.dataset.lab;labSession=null;render();window.scrollTo({top:0,behavior:'smooth'});return}if(b.dataset.action)handleAction(b.dataset.action,b)});
document.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='answerInput'){e.preventDefault();handleAction('submit-game-input',e.target)}if(e.key==='Enter'&&e.target.id==='labInput'){e.preventDefault();handleAction('submit-lab-input',e.target)}});
render();
</script>
</body>
